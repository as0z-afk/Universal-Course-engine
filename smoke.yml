name: Smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free smoke checks
        run: node tests/smoke.mjs
